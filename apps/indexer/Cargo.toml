[package]
name = "indexer"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1"
dotenvy = "0.15.7"
env_logger = "0.11"
log = "0.4"
rdkafka = { version = "0.37.0", features = ["cmake-build"] }
reqwest = { version = "0.12.24", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
