services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        REACT_APP_PUBLIC_API_URL: ${REACT_APP_PUBLIC_API_URL:-http://localhost:5400/api}
    ports:
      - "3000:80"
    depends_on:
      - service

  service:
    build:
      context: .
      dockerfile: apps/service/Dockerfile
    env_file:
      - .env
    ports:
      - "5400:5400"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: stock_sync
      POSTGRES_USER: stock_sync
      POSTGRES_PASSWORD: stock_sync
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stock_sync -d stock_sync"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data: