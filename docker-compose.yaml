services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        REACT_APP_PUBLIC_API_URL: ${REACT_APP_PUBLIC_API_URL:-/api}
    environment:
      SERVICE_UPSTREAM: http://service:${PORT:-5400}
    ports:
      - "${WEB_PORT:-3000}:80"
    depends_on:
      service:
        condition: service_started
      migrations:
        condition: service_completed_successfully

  service:
    build:
      context: .
      dockerfile: apps/service/Dockerfile
    env_file:
      - .env.production
    ports:
      - "${SERVICE_PORT:-5400}:${PORT:-5400}"
    depends_on:
      postgres:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
      meilisearch:
        condition: service_started

  indexer:
    build:
      context: .
      dockerfile: apps/indexer/Dockerfile
    env_file:
      - .env.production
    depends_on:
      kafka:
        condition: service_started
      meilisearch:
        condition: service_started
      migrations:
        condition: service_completed_successfully

  migrations:
    build:
      context: .
      dockerfile: apps/migrations/Dockerfile
    env_file:
      - .env.production
    depends_on:
      postgres:
        condition: service_healthy

  seed:
    build:
      context: .
      dockerfile: apps/seed/Dockerfile
    profiles:
      - tools
    env_file:
      - .env.production
    depends_on:
      postgres:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully

  kafka:
    image: apache/kafka:4.3.1
    hostname: kafka
    env_file:
      - .env.production
    depends_on:
      migrations:
        condition: service_completed_successfully

    ports:
      - "${KAFKA_EXTERNAL_PORT:-9092}:9092"

    environment:
      KAFKA_NODE_ID: 1

      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_LISTENERS: CONTROLLER://:29093,INTERNAL://:19092,EXTERNAL://:9092

      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://${KAFKA_EXTERNAL_HOST:-localhost}:${KAFKA_EXTERNAL_PORT:-9092}

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT

      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    env_file:
      - .env.production

    depends_on:
      kafka:
        condition: service_started
      migrations:
        condition: service_completed_successfully

    ports:
      - "${KAFKA_UI_PORT:-8282}:8080"

    environment:
      KAFKA_CLUSTERS_0_NAME: master
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092

  meilisearch:
    image: getmeili/meilisearch:v1.53
    env_file:
      - .env.production
    depends_on:
      migrations:
        condition: service_completed_successfully
    ports:
      - "${MEILISEARCH_PORT:-7700}:7700"
    environment:
      MEILI_ENV: ${MEILI_ENV:-development}
      MEILI_MASTER_KEY: ${MEILISEARCH_API_KEY}
    volumes:
      - meilisearch-data:/meili_data

  connect:
    image: quay.io/debezium/connect:3.6
    env_file:
      - .env.production
    depends_on:
      kafka:
        condition: service_started
      postgres:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    ports:
      - "${DEBEZIUM_CONNECT_PORT:-8083}:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:19092

      GROUP_ID: debezium-connect

      CONFIG_STORAGE_TOPIC: debezium-connect-configs
      OFFSET_STORAGE_TOPIC: debezium-connect-offsets
      STATUS_STORAGE_TOPIC: debezium-connect-status

      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1

  postgres:
    image: postgres:16-alpine
    env_file:
      - .env.production
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=10
      - -c
      - max_wal_senders=10
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  meilisearch-data:
